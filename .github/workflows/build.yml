# Builds every client on each push, and attaches them to a GitHub release when a v* tag
# is pushed (git tag v1.0 && git push --tags).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the relay loads its channels
        working-directory: relay
        run: |
          for f in src/*.js tools/*.js; do node --check "$f"; done
          node --input-type=module -e "import { loadCustomChannels } from './src/custom.js'; const c = loadCustomChannels(); if (c.length < 2) process.exit(1); console.log(c.map(x => x.meta.name + ': ' + (x.cycleMs / 3.6e6).toFixed(1) + ' h').join(', '))"

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cmake -S desktop -B build && cmake --build build -j4
      - run: |
          mkdir -p out/spelunkr-linux && cp build/spelunkr out/spelunkr-linux/
          cp core/font/OFL-SpaceMono.txt out/spelunkr-linux/
          tar -C out -czf spelunkr-linux-x86_64.tar.gz spelunkr-linux
          cp build/spelunkr spelunkr-linux-x86_64-bin   # for the in-app updater
      - uses: actions/upload-artifact@v4
        with: { name: spelunkr-linux, path: "spelunkr-linux-x86_64*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # MSVC (preinstalled); SDL2 is built from source and linked statically.
      - run: cmake -S desktop -B build -A x64 -DSPELUNKR_VENDOR_SDL=ON
      - run: cmake --build build --config Release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/spelunkr-windows | Out-Null
          Copy-Item build/Release/spelunkr.exe, core/font/OFL-SpaceMono.txt out/spelunkr-windows/
          Compress-Archive -Path out/spelunkr-windows -DestinationPath spelunkr-windows-x64.zip
          Copy-Item build/Release/spelunkr.exe spelunkr-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with: { name: spelunkr-windows, path: "spelunkr-windows-x64.*" }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S desktop -B build -DSPELUNKR_VENDOR_SDL=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build -j4
      - run: |
          mkdir -p out && cp -R build/spelunkr.app out/SPELUNKR.app
          cp core/font/OFL-SpaceMono.txt out/
          cd out && zip -r ../spelunkr-macos.zip SPELUNKR.app OFL-SpaceMono.txt
          cp ../build/spelunkr.app/Contents/MacOS/spelunkr ../spelunkr-macos-bin
      - uses: actions/upload-artifact@v4
        with: { name: spelunkr-macos, path: "spelunkr-macos*" }

  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S vita -B build && cmake --build build -j4 && cp build/eboot.bin spelunkr-vita-eboot.bin
      - uses: actions/upload-artifact@v4
        with: { name: spelunkr-vita, path: "build/spelunkr.vpk\nspelunkr-vita-eboot.bin" }

  ps3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain image is too old (Alpine) to host GitHub's actions, so run it directly.
      - run: docker run --rm -v "$PWD":/src -w /src/ps3 flipacholas/ps3devextra:latest sh -c 'make && make pkg'
      - run: cp ps3/build/pkg/USRDIR/EBOOT.BIN spelunkr-ps3-EBOOT.BIN
      - uses: actions/upload-artifact@v4
        with: { name: spelunkr-ps3, path: "ps3/spelunkr.pkg\nspelunkr-ps3-EBOOT.BIN" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [relay, linux, windows, macos, vita, ps3]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
